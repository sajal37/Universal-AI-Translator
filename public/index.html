<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Universal AI Translator helps you translate text with OCR, real-time queues, and secure accounts.">
    <title>Universal AI Translator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="background-blur"></div>

    <div class="theme-switch" id="themeSwitcher">
        <div class="toggle-track">
            <div class="toggle-sun">☀️</div>
            <div class="toggle-moon">🌙</div>
            <div class="toggle-thumb"></div>
        </div>
    </div>

    <div class="account-chip" id="accountChip">
        <div class="account-avatar" id="accountAvatar">J</div>
        <div class="account-name" id="accountName">John Doe</div>
        <button class="account-logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="auth-layer" id="authLayer">
        <div class="auth-card">
            <button class="auth-close" onclick="closeAuthLayer()">×</button>
            
            <div class="auth-title-wrap">
                <h2 id="authModalTitle">Welcome back</h2>
                <p id="authModalSubtitle">Log in to keep translating</p>
            </div>

            <div class="auth-mode-tabs">
                <button class="auth-mode-tab active" onclick="switchAuthMode('signin')" id="signInTabBtn">Sign In</button>
                <button class="auth-mode-tab" onclick="switchAuthMode('signup')" id="signUpTabBtn">Sign Up</button>
            </div>

            <form class="auth-fields-form" id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="auth-input-group" id="signUpNameGroup" style="display: none;">
                    <label class="auth-input-label">Full Name</label>
                    <input type="text" class="auth-input" id="signUpNameInput" placeholder="Enter your full name">
                </div>

                <div class="auth-input-group">
                    <label class="auth-input-label">Email</label>
                    <input type="email" class="auth-input" id="authEmailInput" placeholder="Enter your email" required>
                </div>

                <div class="auth-input-group">
                    <label class="auth-input-label">Password</label>
                    <input type="password" class="auth-input" id="authPasswordInput" placeholder="Enter your password" required>
                </div>

                <div class="auth-input-group" id="signUpConfirmGroup" style="display: none;">
                    <label class="auth-input-label">Confirm Password</label>
                    <input type="password" class="auth-input" id="signUpConfirmInput" placeholder="Confirm your password">
                </div>

                <div class="auth-button-row">
                    <button type="submit" class="auth-submit" id="authSubmitAction">Sign In</button>
                </div>

                <div class="password-help-link" id="passwordHelpLink">
                    <a href="#" onclick="showPasswordHelp()">Need help signing in?</a>
                </div>
            </form>
        </div>
    </div>

    <div class="translator-shell">
        <div class="product-hero">
            <h1>Universal AI Translator</h1>
            <p>Translate everyday text quickly and clearly.</p>
        </div>

        <div class="workspace-grid">
            <div class="translator-card">
                <div class="workspace-header">
                    <div class="workspace-title">Original Text</div>
                    <div class="language-pick">
                        <select class="language-pick-select" id="fromLanguageSelect">
                            <option value="auto">Auto Detect</option>
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                            <option value="ar">Arabic</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                </div>
                <div class="editor-canvas">
                    <textarea 
                        class="editor-text" 
                        id="sourceTextArea"
                        placeholder="Type or paste your text..."
                        maxlength="5000"
                    ></textarea>
                    <div class="source-counter" id="sourceCharCounter">0 / 5000</div>
                    <button class="speech-capture-btn" id="speechCaptureBtn" title="Dictate with microphone">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="ocr-upload-btn" id="ocrUploadBtn" title="Upload an image for OCR">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                    <input type="file" id="ocrImageInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <div class="translator-card">
                <div class="workspace-header">
                    <div class="workspace-title">Translated Text</div>
                    <div class="language-pick">
                        <select class="language-pick-select" id="toLanguageSelect">
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                            <option value="ar">Arabic</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                </div>
                <div class="editor-canvas">
                    <textarea 
                        class="editor-text translated-editor" 
                        id="translatedTextArea"
                        placeholder="Your translation appears here..."
                        readonly
                    ></textarea>
                    <button class="result-copy-btn" id="resultCopyBtn" onclick="copyTranslatedText()">Copy</button>
                </div>
            </div>
        </div>

        <div class="translation-actions">
            <button class="action-button action-button-primary" id="runTranslationBtn" onclick="runTranslation()">
                Translate
            </button>
            <button class="action-button action-button-secondary" id="clearWorkspaceBtn" onclick="clearWorkspaceText()">
                Clear All
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
